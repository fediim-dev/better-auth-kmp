# <!-- fediim:generated v1 — do not edit; customise via .fediim/overrides/ -->
# Manual (Actions minutes): gh workflow run fediim-guards.yml --ref <branch> -f pr=<n>
# The dispatch ref must be the PR branch: fetch-depth 0 there has the PR commits.
name: fediim-guards
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number
permissions:
  contents: read
  pull-requests: read
jobs:
  static-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      # One step, not $GITHUB_ENV: a PR body line matching the env-file delimiter could set NODE_OPTIONS.
      - name: Run fediim static guards
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
        run: |
          export BASE_SHA="$(gh pr view "$PR" --json baseRefOid --jq .baseRefOid)"
          export HEAD_SHA="$(gh pr view "$PR" --json headRefOid --jq .headRefOid)"
          export PR_BODY="$(gh pr view "$PR" --json body --jq .body)"
          node .fediim/ci/guards.mjs
