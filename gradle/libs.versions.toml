[versions]
kotlin = "2.4.21"
composeMultiplatform = "1.12.2"
agp = "9.4.1"
ktor = "3.6.1"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
multiplatform-settings = "1.3.0"
fds = "0.1.4-SNAPSHOT"
androidx-browser = "1.10.0"
androidx-credentials = "1.6.0"
roborazzi = "1.77.0"
ktfmt = "0.27.0"
android-compileSdk = "37"
android-minSdk = "28"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Plugin artifacts for build-logic (marker coordinates: <id>:<id>.gradle.plugin:<version>)
plugin-kotlin-multiplatform = { module = "org.jetbrains.kotlin.multiplatform:org.jetbrains.kotlin.multiplatform.gradle.plugin", version.ref = "kotlin" }
plugin-android-kmp-library = { module = "com.android.kotlin.multiplatform.library:com.android.kotlin.multiplatform.library.gradle.plugin", version.ref = "agp" }
plugin-ktfmt = { module = "com.ncorti.ktfmt.gradle:com.ncorti.ktfmt.gradle.gradle.plugin", version.ref = "ktfmt" }
